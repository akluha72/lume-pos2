name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql, xml, curl, zip

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Deploy via FTP (lftp)
        run: |
          sudo apt-get install -y lftp
          lftp -e "
            set ftp:ssl-allow no;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
            mirror --reverse --delete --verbose \
              --exclude ^\.git \
              --exclude ^node_modules/ \
              --exclude ^\.env \
              --exclude ^tests/ \
              --exclude ^storage/logs/ \
              --exclude ^storage/framework/ \
              . /home/u562588233/domains/lume-live.raikancinta.com/lume-pos2/;
            quit
          "